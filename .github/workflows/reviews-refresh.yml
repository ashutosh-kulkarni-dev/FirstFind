name: Refresh Store Reviews & AI Score

on:
  schedule:
    # Mondays 04:00 UTC — runs after metro-refresh (03:00), quiet time
    - cron: '0 4 * * 1'
  workflow_dispatch:   # manual trigger from GitHub Actions UI

permissions:
  contents: read       # no repo writes needed — writes go straight to prod DB

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: pip install -r app/backend/requirements.txt

      - name: Ingest reviews + recompute AI scores
        env:
          DATABASE_URL:          ${{ secrets.DATABASE_URL }}
          HUGGINGFACE_TOKEN:     ${{ secrets.HUGGINGFACE_TOKEN }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          ENVIRONMENT:           production
        working-directory: app/backend
        # CSV source is always loaded (zero API calls for the local archive).
        # --google activates the Places API fetch for new reviews since last run.
        # --run-pipeline scores all pending sentiment and recomputes experience_score.
        run: python -m app.ml.ingest_reviews --google --run-pipeline
