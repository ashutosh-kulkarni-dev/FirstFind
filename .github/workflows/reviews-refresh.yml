name: Daily Data Job (stores, reviews, AI score)

on:
  schedule:
    # Daily 04:00 UTC. Daily (not weekly) because the Google key allows only
    # ~100 calls per day: each run fetches reviews for the stores checked
    # longest ago and stops at INGEST_MAX_CALLS (default 90).
    - cron: '0 4 * * *'
  workflow_dispatch:   # manual trigger from GitHub Actions UI
    inputs:
      prune:
        description: 'Delete stores that are in the database but not in data/import/stores.csv'
        type: boolean
        default: false

permissions:
  contents: write      # commits the updated candidate / store CSVs back to the repo

concurrency:
  group: daily-data-job
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: app/backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r app/backend/requirements.txt

      - name: Install sentiment model libraries (CPU)
        # The sentiment models run inside this job: free, and it needs no
        # HuggingFace inference credits. Not installed on the web server.
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers sentencepiece protobuf

      - name: Cache downloaded models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ hashFiles('app/backend/app/config.py') }}
          restore-keys: hf-models-

      - name: Check required secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # Without this the job silently falls back to a local MySQL URL and
        # dies with a confusing "can't connect to localhost" error.
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Daily data job
        env:
          DATABASE_URL:          ${{ secrets.DATABASE_URL }}
          SENTIMENT_LOCAL:       'true'                                  # run the sentiment models in this job
          HUGGINGFACE_TOKEN:     ${{ secrets.HUGGINGFACE_TOKEN }}       # optional fallback (needs paid credits)
          GROQ_API_KEY:          ${{ secrets.GROQ_API_KEY }}            # optional: writes AI store descriptions
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}   # optional: refreshes Google ratings/reviews
          GOOGLE_DAILY_BUDGET:   '90'                                    # the key allows 100 calls/day
          PRUNE_STORES:          ${{ inputs.prune || 'false' }}          # manual clean-up only
          ENVIRONMENT:           production
        working-directory: app/backend
        # import stores -> ingest reviews (+ Google ratings when a key is set) ->
        # sentiment / AI scores / zones / recommendations / descriptions.
        # See app/backend/app/daily_job.py.
        run: python -m app.daily_job

      - name: Commit updated data files
        # The CSVs record which candidates were checked and which stores were
        # added, so they must be saved even if a later step failed.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/import
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "data: daily store verification [skip ci] [skip render]"
            git push
          fi
