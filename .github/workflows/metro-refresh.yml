name: Refresh Metro Data

on:
  schedule:
    # Every Monday at 03:00 UTC — quiet time, avoids Overpass peak load
    - cron: '0 3 * * 1'
  workflow_dispatch:  # allow manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests truststore

      - name: Run metro refresh script
        run: python scripts/refresh_metro.py

      - name: Check if data changed
        id: diff
        run: |
          if git diff --quiet data/metro_stations_blr.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit refreshed metro data
        # Committed straight to main: the repository does not allow Actions to
        # open pull requests, which made every scheduled run fail. The script
        # sanity-checks the data and leaves the file untouched if it looks wrong.
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/metro_stations_blr.json
          git commit -m "data: refresh Namma Metro stations from OSM"
          git push
