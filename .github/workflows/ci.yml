name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend — lint + smoke tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyflakes
      - name: Lint (pyflakes)
        run: python -m pyflakes app/ _verify.py _audit.py
      - name: Smoke tests (SQLite, no external services)
        # Both harnesses spin up the app on a throwaway SQLite DB. With no
        # HUGGINGFACE_TOKEN / GROQ_API_KEY they exercise the VADER + rule-based
        # fallbacks, so CI needs no secrets.
        run: |
          python _verify.py
          python _audit.py

  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
